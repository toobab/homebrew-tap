name: Fetch Clone Stats

on:
  schedule:
    - cron: '0 0 * * *' # každý den o půlnoci
  workflow_dispatch:

permissions:
  contents: write
  actions: write # kvůli spuštění pages.yml

concurrency:
  group: tap-write
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Update clones stats
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python update_stats.py

      - name: Commit and push changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/clones.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Update clone statistics"
          for i in 1 2 3; do
            git pull --rebase && git push && echo "changed=true" >> "$GITHUB_OUTPUT" && exit 0
            sleep 5
          done
          exit 1

      - name: Rebuild GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --ref "${{ github.ref_name }}"
